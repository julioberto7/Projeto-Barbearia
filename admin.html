<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel | Ludugero Barbearia</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: var(--fonte-corpo);
      padding: 40px 20px;
    }

    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .admin-titulo {
      font-family: var(--fonte-titulo);
      font-size: 1.8rem;
      margin-bottom: 24px;
    }

    .admin-filtros {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .admin-filtros button {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .admin-filtros button.ativo {
      background: #fff;
      color: #000;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th,
    td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 600;
    }

    .status-0 {
      background: rgba(200, 150, 10, 0.2);
      color: #d4b020;
    }

    /* Pendente */
    .status-1 {
      background: rgba(59, 114, 11, 0.2);
      color: #6fa832;
    }

    /* Confirmado */
    .status-2 {
      background: rgba(90, 122, 170, 0.2);
      color: #8aacda;
    }

    /* Concluído */
    .status-3 {
      background: rgba(180, 40, 40, 0.2);
      color: #d46060;
    }

    /* Cancelado */
    select.status-select {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.8rem;
    }

    .admin-vazio {
      text-align: center;
      padding: 60px 0;
      color: rgba(255, 255, 255, 0.4);
    }

    .admin-erro {
      text-align: center;
      padding: 20px;
      color: #d46060;
    }


    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-sair {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .btn-sair:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Cards de estatística */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 20px;
    }

    .stat-card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 8px;
    }

    .stat-card-valor {
      font-family: var(--fonte-titulo);
      font-size: 1.9rem;
      color: #fff;
    }

    .stat-card-valor.destaque {
      color: #6fa832;
    }

    /* Gráficos */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .chart-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 20px;
    }

    .chart-card h3 {
      font-family: var(--fonte-titulo);
      font-size: 0.95rem;
      margin-bottom: 16px;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .chart-card-wrap {
      position: relative;
      height: 220px;
    }

    /* Título da seção de tabela, pra separar visualmente do dashboard */
    .secao-tabela-titulo {
      font-family: var(--fonte-titulo);
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <div class="admin-container">
    <div class="admin-header">
      <h1 class="admin-titulo" style="margin-bottom:0;">💈 Painel de Agendamentos</h1>
      <button id="btn-sair" class="btn-sair">Sair</button>
    </div>

    <div class="stats-grid" id="stats-grid"></div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>Serviços mais pedidos</h3>
        <div class="chart-card-wrap"><canvas id="chart-servicos"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Agendamentos por dia da semana</h3>
        <div class="chart-card-wrap"><canvas id="chart-dias"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Status dos agendamentos</h3>
        <div class="chart-card-wrap"><canvas id="chart-status"></canvas></div>
      </div>
    </div>

    <p class="secao-tabela-titulo">Lista de agendamentos</p>

    <div class="admin-filtros" id="filtros">
      <button data-filtro="todos" class="ativo">Todos</button>
      <button data-filtro="0">Pendentes</button>
      <button data-filtro="1">Confirmados</button>
      <button data-filtro="2">Concluídos</button>
      <button data-filtro="3">Cancelados</button>
    </div>

    <div id="conteudo">Carregando...</div>
  </div>

  <script>
    const API_URL = 'http://localhost:5167/api/agendamentos';
    const STATUS_NOMES = ['Pendente', 'Confirmado', 'Concluído', 'Cancelado'];
    let chartServicos, chartDias, chartStatus;
    let agendamentosTodos = [];
    let filtroAtual = 'todos';

    function extrairPreco(servicoOuPlano) {
      const match = servicoOuPlano.match(/R\$\s*([\d.,]+)/);
      if (!match) return 0;
      return parseFloat(match[1].replace('.', '').replace(',', '.'));
    }

    function renderizarStats(lista) {
      const total = lista.length;
      const concluidos = lista.filter(a => a.status === 2).length;
      const cancelados = lista.filter(a => a.status === 3).length;
      const faturamento = lista
        .filter(a => a.status !== 3) // não conta cancelados
        .reduce((soma, a) => soma + extrairPreco(a.servicoOuPlano), 0);
      const taxaConclusao = total > 0 ? Math.round((concluidos / total) * 100) : 0;

      document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card">
      <p class="stat-card-label">Total de agendamentos</p>
      <p class="stat-card-valor">${total}</p>
    </div>
    <div class="stat-card">
      <p class="stat-card-label">Faturamento estimado</p>
      <p class="stat-card-valor destaque">R$ ${faturamento.toFixed(2).replace('.', ',')}</p>
    </div>
    <div class="stat-card">
      <p class="stat-card-label">Taxa de conclusão</p>
      <p class="stat-card-valor">${taxaConclusao}%</p>
    </div>
    <div class="stat-card">
      <p class="stat-card-label">Cancelados</p>
      <p class="stat-card-valor">${cancelados}</p>
    </div>
  `;
    }

    function renderizarGraficos(lista) {
      const corTexto = 'rgba(255,255,255,0.7)';
      const corGrid = 'rgba(255,255,255,0.08)';

      // ── Gráfico de serviços mais pedidos ──
      const contagemServicos = {};
      lista.forEach(a => {
        const nome = a.servicoOuPlano.split('—')[0].trim();
        contagemServicos[nome] = (contagemServicos[nome] || 0) + 1;
      });
      const topServicos = Object.entries(contagemServicos)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6);

      if (chartServicos) chartServicos.destroy();
      chartServicos = new Chart(document.getElementById('chart-servicos'), {
        type: 'bar',
        data: {
          labels: topServicos.map(s => s[0]),
          datasets: [{ data: topServicos.map(s => s[1]), backgroundColor: '#6fa832' }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: corTexto, font: { size: 10 } }, grid: { color: corGrid } },
            y: { ticks: { color: corTexto, stepSize: 1 }, grid: { color: corGrid }, beginAtZero: true }
          }
        }
      });

      // ── Gráfico de agendamentos por dia da semana ──
      const diasNomes = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      const contagemDias = [0, 0, 0, 0, 0, 0, 0];
      lista.forEach(a => {
        const dia = new Date(a.data + 'T00:00:00').getDay();
        contagemDias[dia]++;
      });

      if (chartDias) chartDias.destroy();
      chartDias = new Chart(document.getElementById('chart-dias'), {
        type: 'bar',
        data: {
          labels: diasNomes,
          datasets: [{ data: contagemDias, backgroundColor: '#8aacda' }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: corTexto }, grid: { color: corGrid } },
            y: { ticks: { color: corTexto, stepSize: 1 }, grid: { color: corGrid }, beginAtZero: true }
          }
        }
      });

      // ── Gráfico de status ──
      const statusNomes = ['Pendente', 'Confirmado', 'Concluído', 'Cancelado'];
      const statusCores = ['#d4b020', '#6fa832', '#8aacda', '#d46060'];
      const contagemStatus = [0, 0, 0, 0];
      lista.forEach(a => contagemStatus[a.status]++);

      if (chartStatus) chartStatus.destroy();
      chartStatus = new Chart(document.getElementById('chart-status'), {
        type: 'doughnut',
        data: {
          labels: statusNomes,
          datasets: [{ data: contagemStatus, backgroundColor: statusCores, borderWidth: 0 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: corTexto, font: { size: 11 } } } }
        }
      });
    }

    function renderizarDashboard() {
      renderizarStats(agendamentosTodos);
      renderizarGraficos(agendamentosTodos);
    }

    async function carregarAgendamentos() {
      const conteudo = document.getElementById('conteudo');
      try {
        const resposta = await fetch(API_URL);
        if (!resposta.ok) throw new Error('Falha ao carregar');
        agendamentosTodos = await resposta.json();
        renderizarDashboard(); 
        renderizar();
      } catch (erro) {
        conteudo.innerHTML = `<p class="admin-erro">Não foi possível carregar os agendamentos. A API está rodando?</p>`;
        console.error(erro);
      }
    }

    function renderizar() {
      const conteudo = document.getElementById('conteudo');
      const lista = filtroAtual === 'todos'
        ? agendamentosTodos
        : agendamentosTodos.filter(a => a.status === Number(filtroAtual));

      if (lista.length === 0) {
        conteudo.innerHTML = `<p class="admin-vazio">Nenhum agendamento encontrado.</p>`;
        return;
      }

      const linhas = lista.map(a => `
        <tr>
          <td>${a.nomeCliente}</td>
          <td>${a.telefone}</td>
          <td>${a.barbeiro || '—'}</td>
          <td>${a.servicoOuPlano}</td>
          <td>${formatarData(a.data)}</td>
          <td>${a.horario.slice(0, 5)}</td>
          <td><span class="status-badge status-${a.status}">${STATUS_NOMES[a.status]}</span></td>
          <td>
            <select class="status-select" data-id="${a.id}">
              ${STATUS_NOMES.map((nome, i) => `<option value="${i}" ${i === a.status ? 'selected' : ''}>${nome}</option>`).join('')}
            </select>
          </td>
        </tr>
      `).join('');

      conteudo.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Cliente</th><th>Telefone</th><th>Barbeiro</th><th>Serviço</th>
              <th>Data</th><th>Hora</th><th>Status</th><th>Alterar</th>
            </tr>
          </thead>
          <tbody>${linhas}</tbody>
        </table>
      `;

      document.querySelectorAll('.status-select').forEach(select => {
        select.addEventListener('change', async (e) => {
          const id = e.target.dataset.id;
          const novoStatus = Number(e.target.value);
          await atualizarStatus(id, novoStatus);
        });
      });
    }

    async function atualizarStatus(id, novoStatus) {
      try {
        const resposta = await fetch(`${API_URL}/${id}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(novoStatus)
        });
        if (!resposta.ok) throw new Error('Falha ao atualizar');
        await carregarAgendamentos();
      } catch (erro) {
        alert('Erro ao atualizar status.');
        console.error(erro);
      }
    }

    function formatarData(dataStr) {
      const [ano, mes, dia] = dataStr.split('-');
      return `${dia}/${mes}/${ano}`;
    }

    document.getElementById('filtros').addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') return;
      document.querySelectorAll('#filtros button').forEach(b => b.classList.remove('ativo'));
      e.target.classList.add('ativo');
      filtroAtual = e.target.dataset.filtro;
      renderizar();
    });



    carregarAgendamentos();
  </script>

</body>

</html>
